<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 운동 기록 관리</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (깔끔한 UI 아이콘용) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* 부드러운 등장 애니메이션 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-sm">
                    <i data-lucide="activity" class="w-5 h-5"></i>
                </div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">학생 체육 활동 기록장</h1>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" id="refreshBtn" onclick="fetchInitialData()" 
                    class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer" title="새로고침">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
                <span id="connectionBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-200">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                    시트 연결됨
                </span>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- 알림 메시지 박스 (alert 대신 사용) -->
        <div id="toastMessage" class="hidden fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 transition-all duration-300">
            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
            <span id="toastText" class="text-sm font-medium">기록이 추가되었습니다.</span>
        </div>

        <!-- 1. 운동 기록 입력 폼 카드 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            <div class="mb-6">
                <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
                    새 운동 기록 입력
                </h2>
                <p class="text-sm text-slate-500 mt-1">학생을 선택하고 오늘 수행한 운동 종목과 기록을 입력해주세요.</p>
            </div>

            <form id="exerciseForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 학생 이름 드롭다운 -->
                    <div>
                        <label for="studentSelect" class="block text-sm font-semibold text-slate-700 mb-2">
                            학생 이름 <span class="text-rose-500">*</span>
                        </label>
                        <div class="relative">
                            <select id="studentSelect" required disabled
                                class="w-full appearance-none bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block p-3.5 pr-10 transition-colors cursor-pointer disabled:opacity-60 disabled:cursor-wait">
                                <option value="" disabled selected>학생 명단을 불러오는 중...</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 운동 종목 선택 (달리기 / 축구 / 줄넘기) -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            운동 종목 <span class="text-rose-500">*</span>
                        </label>
                        <div class="grid grid-cols-3 gap-2.5" id="sportSelector">
                            <!-- 달리기 -->
                            <label class="cursor-pointer">
                                <input type="radio" name="sport" value="달리기" class="peer sr-only" checked>
                                <div class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700 hover:bg-slate-100 transition-all">
                                    <span class="text-lg mb-0.5">🏃</span>
                                    <span class="text-xs font-semibold">달리기</span>
                                </div>
                            </label>
                            <!-- 축구 -->
                            <label class="cursor-pointer">
                                <input type="radio" name="sport" value="축구" class="peer sr-only">
                                <div class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 hover:bg-slate-100 transition-all">
                                    <span class="text-lg mb-0.5">⚽</span>
                                    <span class="text-xs font-semibold">축구</span>
                                </div>
                            </label>
                            <!-- 줄넘기 -->
                            <label class="cursor-pointer">
                                <input type="radio" name="sport" value="줄넘기" class="peer sr-only">
                                <div class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 peer-checked:border-amber-600 peer-checked:bg-amber-50 peer-checked:text-amber-700 hover:bg-slate-100 transition-all">
                                    <span class="text-lg mb-0.5">🪢</span>
                                    <span class="text-xs font-semibold">줄넘기</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 기록 및 메모 입력 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-1">
                        <label for="recordInput" id="recordLabel" class="block text-sm font-semibold text-slate-700 mb-2">
                            기록 (예: 50m 8.2초) <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="recordInput" required placeholder="예: 100m 15.4초"
                            class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block p-3.5 transition-colors">
                    </div>

                    <div class="md:col-span-2">
                        <label for="memoInput" class="block text-sm font-semibold text-slate-700 mb-2">
                            특이사항 / 메모 (선택)
                        </label>
                        <input type="text" id="memoInput" placeholder="예: 자세가 매우 좋아짐, 완주 성공"
                            class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block p-3.5 transition-colors">
                    </div>
                </div>

                <!-- 제출 버튼 -->
                <div class="flex justify-end pt-2">
                    <button type="submit" id="submitBtn"
                        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:bg-indigo-400 text-white font-semibold text-sm px-6 py-3.5 rounded-xl shadow-sm transition-all cursor-pointer disabled:cursor-not-allowed">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span id="submitBtnText">기록 저장하기</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. 최신순 운동 기록 목록 섹션 -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <h2 class="text-lg font-bold text-slate-900">최근 운동 기록</h2>
                    <span id="recordCount" class="bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-0.5 rounded-full">
                        0건
                    </span>
                </div>
                <span class="text-xs text-slate-500 flex items-center gap-1">
                    <i data-lucide="arrow-down-wide-narrow" class="w-3.5 h-3.5"></i>
                    최신순 정렬
                </span>
            </div>

            <!-- 데이터 로딩 인디케이터 -->
            <div id="loadingState" class="bg-white rounded-2xl border border-slate-200 p-12 text-center space-y-3">
                <div class="mx-auto w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                <p class="text-sm font-medium text-slate-600">구글 시트에서 기록을 불러오는 중입니다...</p>
            </div>

            <!-- 기록 카드 리스트 컨테이너 -->
            <div id="recordList" class="space-y-3 hidden">
                <!-- JavaScript로 동적 렌더링 -->
            </div>

            <!-- 데이터가 없을 때 표시될 빈 상태 화면 -->
            <div id="emptyState" class="hidden bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center">
                <div class="mx-auto w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mb-3">
                    <i data-lucide="clipboard-list" class="w-6 h-6"></i>
                </div>
                <h3 class="text-sm font-semibold text-slate-900">아직 등록된 운동 기록이 없습니다</h3>
                <p class="text-xs text-slate-500 mt-1">위 폼을 작성하여 첫 번째 운동 기록을 추가해보세요.</p>
            </div>
        </section>

    </main>

    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

        // Google Apps Script 웹 앱 URL (새 배포 주소 반영)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKkS3qov-mWXDChzNXwgv3rY0WFkrd5kvM5OnyswsiioITS6g8cm_-RrnzHqkOklWk/exec';

        // 서버에서 받아온 기록 데이터를 담을 배열
        let records = [];

        // DOM 요소 참조
        const exerciseForm = document.getElementById('exerciseForm');
        const studentSelect = document.getElementById('studentSelect');
        const sportRadios = document.querySelectorAll('input[name="sport"]');
        const recordInput = document.getElementById('recordInput');
        const recordLabel = document.getElementById('recordLabel');
        const memoInput = document.getElementById('memoInput');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const recordList = document.getElementById('recordList');
        const recordCount = document.getElementById('recordCount');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const toastMessage = document.getElementById('toastMessage');
        const toastText = document.getElementById('toastText');
        const connectionBadge = document.getElementById('connectionBadge');

        // 운동 종목 변경 시 입력 가이드(placeholder) 동적 변경
        const sportPlaceholders = {
            '달리기': { label: '기록 (예: 50m 8.2초)', placeholder: '예: 100m 15.4초' },
            '축구': { label: '기록 (예: 리프팅 30회)', placeholder: '예: 드리블 통과 22초 / 슈팅 5골' },
            '줄넘기': { label: '기록 (예: 1분 120회)', placeholder: '예: 2단 뛰기 25회 / 1분간 140회' }
        };

        sportRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const selected = e.target.value;
                const guide = sportPlaceholders[selected];
                if (guide) {
                    recordLabel.innerHTML = `${guide.label} <span class="text-rose-500">*</span>`;
                    recordInput.placeholder = guide.placeholder;
                }
            });
        });

        // 종목별 배지 스타일 및 아이콘 반환 함수
        function getSportBadge(sport) {
            switch (sport) {
                case '달리기':
                    return {
                        emoji: '🏃',
                        bgClass: 'bg-indigo-50 text-indigo-700 border-indigo-200'
                    };
                case '축구':
                    return {
                        emoji: '⚽',
                        bgClass: 'bg-emerald-50 text-emerald-700 border-emerald-200'
                    };
                case '줄넘기':
                    return {
                        emoji: '🪢',
                        bgClass: 'bg-amber-50 text-amber-700 border-amber-200'
                    };
                default:
                    return {
                        emoji: '🏅',
                        bgClass: 'bg-slate-100 text-slate-700 border-slate-200'
                    };
            }
        }

        // 토스트 메시지 표시 함수
        let toastTimeout;
        function showToast(message, isError = false) {
            toastText.textContent = message;
            const icon = toastMessage.querySelector('i');
            if (isError) {
                toastMessage.classList.remove('bg-slate-900');
                toastMessage.classList.add('bg-rose-600');
                if (icon) icon.setAttribute('data-lucide', 'alert-circle');
            } else {
                toastMessage.classList.remove('bg-rose-600');
                toastMessage.classList.add('bg-slate-900');
                if (icon) icon.setAttribute('data-lucide', 'check-circle-2');
            }
            lucide.createIcons();
            
            toastMessage.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastMessage.classList.add('hidden');
            }, 3500);
        }

        // 학생명단 드롭다운 채우기 함수
        function populateStudentDropdown(students) {
            const currentSelected = studentSelect.value;
            studentSelect.innerHTML = '<option value="" disabled selected>학생을 선택하세요</option>';
            
            if (!students || students.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.disabled = true;
                opt.textContent = '등록된 학생이 없습니다';
                studentSelect.appendChild(opt);
                studentSelect.disabled = false;
                return;
            }

            students.forEach(student => {
                const option = document.createElement('option');
                option.value = student.name;
                // 번호가 있으면 "1번 김민준", 없으면 "김민준" 형태로 표시
                option.textContent = student.number ? `${student.number}번 ${student.name}` : student.name;
                studentSelect.appendChild(option);
            });

            // 기존 선택값이 유효하다면 유지
            if (currentSelected && students.some(s => s.name === currentSelected)) {
                studentSelect.value = currentSelected;
            }
            
            studentSelect.disabled = false;
        }

        // 기록 목록 렌더링 함수
        function renderRecords() {
            loadingState.classList.add('hidden');
            recordCount.textContent = `${records.length}건`;

            if (records.length === 0) {
                recordList.classList.add('hidden');
                recordList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            recordList.classList.remove('hidden');
            recordList.innerHTML = '';

            records.forEach((item, index) => {
                const badge = getSportBadge(item.sport);
                const isLatest = index === 0; // 가장 최신 항목 강조

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-4 sm:p-5 border transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4 animate-fade-in-down ${
                    isLatest ? 'border-indigo-200 shadow-sm ring-1 ring-indigo-50' : 'border-slate-200'
                }`;

                card.innerHTML = `
                    <div class="flex items-start sm:items-center gap-3.5">
                        <!-- 종목 아이콘 박스 -->
                        <div class="w-11 h-11 rounded-xl border flex items-center justify-center text-xl shrink-0 ${badge.bgClass}">
                            ${badge.emoji}
                        </div>
                        
                        <div class="space-y-1">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="font-bold text-slate-900 text-base">${escapeHTML(item.name)}</span>
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${badge.bgClass}">
                                    ${escapeHTML(item.sport)}
                                </span>
                                ${isLatest ? '<span class="text-[11px] font-bold bg-indigo-600 text-white px-2 py-0.5 rounded-md">최신</span>' : ''}
                            </div>
                            <p class="text-sm font-semibold text-slate-800">
                                기록: <span class="text-indigo-600">${escapeHTML(item.record)}</span>
                            </p>
                        </div>
                    </div>

                    <div class="flex sm:flex-col items-center sm:items-end justify-between border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 text-xs text-slate-400 shrink-0">
                        <span class="flex items-center gap-1">
                            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                            ${escapeHTML(item.time || '시간 정보 없음')}
                        </span>
                    </div>
                `;

                recordList.appendChild(card);
            });

            // 동적으로 생성된 아이콘 다시 렌더링
            lucide.createIcons();
        }

        // XSS 방지용 이스케이프 함수
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // GET 요청: Apps Script에서 학생명단 및 최신순 기록 불러오기 (커스텀 헤더 없이 호출하여 CORS 방지)
        async function fetchInitialData() {
            const refreshIcon = document.querySelector('#refreshBtn i');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            try {
                // 커스텀 헤더 없이 단순 GET 요청으로 호출
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) {
                    throw new Error(`HTTP 오류! 상태 코드: ${response.status}`);
                }

                const result = await response.json();

                if (result.status === 'success') {
                    populateStudentDropdown(result.students || []);
                    records = result.records || [];
                    renderRecords();
                } else {
                    throw new Error(result.message || '데이터를 불러오는데 실패했습니다.');
                }
            } catch (error) {
                console.error('데이터 조회 에러:', error);
                loadingState.classList.add('hidden');
                studentSelect.innerHTML = '<option value="" disabled selected>명단 불러오기 실패</option>';
                showToast(`데이터 조회 실패: ${error.message}`, true);
                
                connectionBadge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200';
                connectionBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>연결 오류';
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        // POST 요청: 폼 제출 시 구글 시트에 새 기록 저장 (커스텀 헤더 없이 호출하여 CORS Preflight 회피)
        exerciseForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = studentSelect.value;
            const sport = document.querySelector('input[name="sport"]:checked').value;
            const rawRecord = recordInput.value.trim();
            const memo = memoInput.value.trim();

            if (!name || !rawRecord) return;

            // 시트 구조(이름, 종목, 기록, 시간)에 맞춰 메모가 있으면 기록 텍스트에 자연스럽게 병기
            const finalRecord = memo ? `${rawRecord} (${memo})` : rawRecord;

            // 중복 제출 방지 및 로딩 UI 처리
            submitBtn.disabled = true;
            submitBtnText.textContent = '시트에 저장 중...';

            try {
                // 커스텀 헤더(Content-Type: application/json 등)를 생략하고 문자열을 body에 담아 전송하면
                // 브라우저가 text/plain Simple Request로 인식해 OPTIONS Preflight(CORS 에러)가 발생하지 않음
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: name,
                        sport: sport,
                        record: finalRecord
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    // 서버에서 기록된 정확한 시간(result.data)을 받아 목록 최상단에 즉시 반영
                    if (result.data) {
                        records.unshift(result.data);
                        renderRecords();
                    } else {
                        // 만약 반환 데이터가 없다면 전체 목록 새로고침
                        await fetchInitialData();
                    }

                    // 입력 폼 초기화
                    recordInput.value = '';
                    memoInput.value = '';
                    recordInput.focus();

                    showToast(`${name} 학생의 ${sport} 기록이 구글 시트에 저장되었습니다.`);
                } else {
                    throw new Error(result.message || '저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('기록 저장 에러:', error);
                showToast(`저장 중 오류 발생: ${error.message}`, true);
            } finally {
                submitBtn.disabled = false;
                submitBtnText.textContent = '기록 저장하기';
            }
        });

        // 페이지 로드 시 구글 시트 데이터 불러오기
        window.addEventListener('DOMContentLoaded', () => {
            fetchInitialData();
        });
    </script>
</body>
</html>
